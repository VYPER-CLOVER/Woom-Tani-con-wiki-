<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woomtani - Registro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/registro.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="../index.html">
                <img src="../img/mome.png" alt="Logo Woomtani" class="logo">
            </a>
        </div>
        <h1 id="titulo">Welcome to the new DLC of the Ucrania</h1>
        <nav class="menu_arriba">
            <a href="../index.html">Inicio</a>
            <a href="../pages/wiki.html">Wiki</a>
        </nav>
    </header>
    
    <main>
        <div class="form-container">
            <h2 class="form-title">Crear Cuenta</h2>
            <form class="registro-form" action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="usuario">Nombre de usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Elige un usuario" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" required>
                </div>
                <div class="form-group">
                    <label for="pais">País</label>
                    <select id="pais" name="pais" required>
                        <option value="">Selecciona tu país</option>
                        <option value="mx">México</option>
                        <option value="ar">Argentina</option>
                        <option value="co">Colombia</option>
                        <option value="cl">Chile</option>
                        <option value="pe">Perú</option>
                        <option value="es">España</option>
                        <option value="us">Estados Unidos</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los <a href="#">Términos y Condiciones</a></label>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-registro">Registrarse</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="datos-contacto">
            <div class="links-legales">
                <a href="../pages/privacidad.html">Políticas de Privacidad</a>
                <a href="../pages/terminos.html">Términos y Condiciones</a>
            </div>
            <p class="copyright">&copy; 2026 Todos los derechos reservados a Woomtani</p>
        </div>
        <nav class="menu_abajo">
            <a href="../pages/registro.html">Registro</a>
            <a href="../pages/wiki.html">Wiki</a>
        </nav>
    </footer>
</body>
</html>
